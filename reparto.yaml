# reparto.yaml — configuración del ciclo
#
# Lo escribe el orquestador, lo aprueba el humano.
# Es configuración, no código: cambiarlo no requiere tocar nada más.
# Sin este archivo válido, el ciclo no arranca.

version: 1

roles:

  constructor:
    modelo: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
    entorno: "opencode"                  # opencode | dsh | openclaw | claude-code | otro
    cwd: "~/proyectos/android/frase-del-dia-app"
    acceso:
      - ruta: "~/proyectos/android/frase-del-dia-app"
        modo: rw                         # rw | ro
      - ruta: "~/proyectos/android/frase-del-dia-contratos"
        modo: ro
    trigger:
      modo: agente                       # agente | tiempo | usuario
      desde: ["orquestador"]             # quién puede despertarlo (solo si modo = agente)
      cada: null                         # intervalo, solo si modo = tiempo (ej: "10m")
    entrega:
      - "repo"
      - "commit"
      - "evidencia/<slug>.md"

  qa:
    modelo: "openrouter/stealth/space-bunny-alpha"
    entorno: "opencode"
    cwd: "~/proyectos/android"
    acceso:
      - ruta: "~/proyectos/android/frase-del-dia-app/build"
        modo: ro                         # el QA lee el build, no lo modifica
      - ruta: "~/proyectos/android/frase-del-dia-app/evidencia"
        modo: rw
      - ruta: "~/proyectos/android/frase-del-dia-app/src"
        modo: ro
    trigger:
      modo: agente
      desde: ["constructor", "orquestador"]
      cada: null
    entrega:
      - "evidencia/QA-<slug>.md"

  orquestador:
    modelo: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
    entorno: "opencode"
    cwd: "~/proyectos/android"
    acceso:
      - ruta: "~/proyectos/android"
        modo: rw
    trigger:
      modo: usuario                      # solo cuando el humano lo invoca
      desde: []
      cada: null
    entrega:
      - "reparto.yaml"
      - "estado del ciclo"
